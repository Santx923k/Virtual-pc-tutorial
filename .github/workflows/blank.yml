name: PC Virtual Gratis

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Baixando e Instalando o AnyDesk
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Invoke-WebRequest -Uri "https://anydesk.com" -OutFile "AnyDesk.exe"
        Start-Process -FilePath ".\AnyDesk.exe" -ArgumentList "--install C:\AnyDesk --silent --start-with-win" -Wait
        
    - name: Definindo Senha de Acesso Remoto
      run: |
        echo "Defina a sua senha para acessar o PC Virtual pelo aplicativo do celular"
        # O script original costuma injetar uma senha padrão no registro ou via prompt do AnyDesk para permitir login não supervisionado
        
    - name: Manter Maquina Ativa
      run: |
        $loop = $true
        while($loop) {
          Start-Sleep -Seconds 60
        }
